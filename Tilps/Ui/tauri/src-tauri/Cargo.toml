[package]
name = "domino-ui"
version = "0.1.0"
description = "PROJECT:Domino - Tauri 2 UI"
authors = ["Domino"]
edition = "2021"

[lib]
name = "domino_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
